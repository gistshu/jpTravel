[project]
name = "jp-travel"
version = "0.1.0"
description = "Japan 100 Castles travel journal web API."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "pillow>=11.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
